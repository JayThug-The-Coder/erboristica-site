[[headers]]
  for = "/*"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Immagini: stale-while-revalidate -> il browser serve SUBITO la copia in cache
# (niente round-trip bloccante a ogni navigazione = foto istantanee sui ritorni)
# e rivalida in background. Una foto sostituita si aggiorna al caricamento successivo.
[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

[[headers]]
  for = "*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

[[headers]]
  for = "*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=604800"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
