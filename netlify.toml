[[headers]]
  for = "/*"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Disattiva il post-processing di Netlify (bundle/minify HTML-CSS-JS,
# compressione immagini): storicamente corrompe caratteri UTF-8 multi-byte
# (accenti) nei file JS/HTML durante la minificazione. Il sito e' gia'
# statico e non ne ha bisogno.
[build.processing]
  skip_processing = true
[build.processing.css]
  bundle = false
  minify = false
[build.processing.js]
  bundle = false
  minify = false
[build.processing.html]
  pretty_urls = true
[build.processing.images]
  compress = false

[[headers]]
  for = "*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Immagini: stale-while-revalidate -> il browser serve SUBITO la copia in cache
# (niente round-trip bloccante a ogni navigazione = foto istantanee sui ritorni)
# e rivalida in background. Una foto sostituita si aggiorna al caricamento successivo.
[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

[[headers]]
  for = "*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

[[headers]]
  for = "*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=604800"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
